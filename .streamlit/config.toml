[client]
# Chỉ hiện tối thiểu trên thanh công cụ; nút Fork / GitHub / menu được ẩn thêm bằng CSS trong app.py
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false

[theme]
# Giao diện được thiết kế cho nền sáng: cố định để máy đặt chế độ tối không bị chữ trắng trên nền sáng
base = "light"
primaryColor = "#1E40AF"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F6"
textColor = "#0F172A"
font = "sans serif"
